application:
  name: dagster
  pods:
  - name: app
    image: mirror.gcr.io/dagster/dagster-k8s:1.11.14
    path: /
    command: sh -c "mkdir -p $DAGSTER_HOME && exec dagster-webserver --empty-workspace -h 0.0.0.0 -p 3000"
    servicePorts:
    - 3000
    vars:
      DAGSTER_HOME: /opt/dagster/dagster_home
